spring.application.name=backend
# Load a project-root or backend-local .env file when present. The .properties
# hint lets Spring Boot parse the conventional KEY=value dotenv format.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
youtube.api.key=${YOUTUBE_API_KEY}
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=openai/gpt-4o-mini
transcript.service.url=${TRANSCRIPT_SERVICE_URL:http://localhost:8000}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
