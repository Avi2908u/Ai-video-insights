spring.application.name=backend
server.port=${PORT:8080}
# Load a project-root or backend-local .env file when present. The .properties
# hint lets Spring Boot parse the conventional KEY=value dotenv format.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
youtube.api.key=${youtube.api.key:${YOUTUBE_API_KEY:}}
openrouter.api.key=${openrouter.api.key:${OPENROUTER_API_KEY:}}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=openai/gpt-4o-mini
transcript.service.url=${transcript.service.url:${TRANSCRIPT_SERVICE_URL:http://localhost:8000}}
spring.datasource.url=${spring.datasource.url:${DB_URL:jdbc:postgresql://localhost:5432/ai_video_insights}}
spring.datasource.username=${spring.datasource.username:${DB_USERNAME:postgres}}
spring.datasource.password=${spring.datasource.password:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
